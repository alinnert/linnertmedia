<article class="px-4">
  <div class="mb-1">
    <div class="prose prose-stone prose-lg dark:prose-invert">
      <h2 class="mb-1">{{ .Title }}</h2>
      {{ .Content }}
    </div>

    <div class="grid grid-cols-2 gap-2 mt-4">
      {{ $linkTypes := slice "website" "github" }}
      {{ $links := .Params.links }}

      {{ range $linkTypes }}
        {{ if isset $links . }}
          {{ $url := ( index $links . ) }}
          {{ $type := . }}
      
          {{ partial "general/iconlink.html" ( dict "type" $type "url" $url ) }}
        {{ end }}
      {{ end }}
    </div>
  </div>
</article>
